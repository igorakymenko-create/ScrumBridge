  const u = session.usage;
  return `<h3>${esc(t('session.usage'))}</h3><div class="stats"><div class="stat"><b>${u.requests}</b><span class="muted small">${esc(t('session.requests'))}</span></div><div class="stat"><b>${Math.round(u.inTokens / 1000)}k</b><span class="muted small">${esc(t('session.tokIn'))}</span></div><div class="stat"><b>${Math.round(u.outTokens / 1000)}k</b><span class="muted small">${esc(t('session.tokOut'))}</span></div></div>
<h3>${esc(t('session.handoffH'))}</h3><div class="muted small" style="margin-bottom:6px">${esc(t('session.handoffHint'))}</div>
<div class="stack"><button class="btn primary" data-act="export-md" ${session.plan ? '' : 'disabled'}>${esc(t('session.handoffBtn'))}</button></div>
${SERVER ? ui.connectBlock() + ui.autopilotBlock() : ''}
<h3>${esc(t('session.sessionH'))}</h3><div class="stack"><button class="btn" data-act="export-json">${esc(t('session.exportJson'))}</button><button class="btn" data-act="import-json">${esc(t('session.import'))}</button><button class="btn" data-act="new">${esc(t('session.new'))}</button></div>
<div class="muted small" style="margin-top:10px">${esc(t('session.format', {schema:SCHEMA, v:APP_VERSION}))}</div>`;
 },
 settingsOpen(){
  const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
  const lvlOpts = sel => LEVEL_IDS.map(l => opt(l, t('level.' + l), sel === l)).join('');
  $('#sUiLang').innerHTML = Object.keys(LANGS).map(c => opt(c, LANGS[c], settings.uiLang === c)).join('');
  $('#sTeamLang').innerHTML = opt('auto', t('set.teamLangAuto'), settings.teamLang === 'auto') + Object.keys(LANGS).map(c => opt(c, LANGS[c], settings.teamLang === c)).join('') + opt('other', t('set.teamLangOther'), settings.teamLang === 'other');
  $('#sTeamLangCustom').value = settings.teamLangCustom; ui.customLangVis();
  $('#sProvider').innerHTML = connList().map(c => opt(c.id, c.label, settings.provider === c.id)).join('') + opt('demo', t('set.providerDemo'), settings.provider === 'demo');
  $('#provMgr').hidden = !SERVER; ui.provManager();
  $('#sKey').value = SERVER ? '' : settings.apiKey; $('#sRemember').checked = settings.rememberKey; ui.replacingKey = false; ui.keyStatus();
  $('#sModel').value = settings.model; $('#sLevel').innerHTML = lvlOpts(settings.level);
  $('#sDomainLevels').innerHTML = DOMAIN_IDS.map(d => `<label>${esc(t('domain.' + d))}</label><select data-dl="${d}"><option value="">${esc(t('set.sameAsGeneral'))}</option>${lvlOpts(settings.domainLevels[d])}</select>`).join('');
  $('#sRoleModels').innerHTML = ['sm', ...TEAM_ROLES].map(r => `<label>${esc(roleName(r))}</label><div class="inline"><select data-rmp="${r}"><option value="">${esc(t('prov.sameAsDefault'))}</option>${connList().map(c => `<option value="${esc(c.id)}" ${(settings.roleModels[r] || {}).provider === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select><input type="text" list="modelList" data-rm="${r}" value="${esc((settings.roleModels[r] || {}).model || '')}" placeholder="${esc(t('set.byDefault'))}"></div>`).join('');
  $('#sRounds').value = settings.maxRounds; $('#sRpm').value = settings.rpm; $('#sTemp').value = settings.temperature;
  $('#sEconomy').checked = settings.economy; $('#sVerify').checked = settings.verifyRenderings;
  document.querySelectorAll('.srvonly').forEach(e => { e.hidden = !SERVER; });
  if(SERVER) loadWait();
  ui.keyFieldVis(); $('#sModelHint').textContent = t('set.modelHint'); $('#settingsOv').classList.add('on');
 },
 keyStatus(){
  const row = $('#sRememberRow'), del = $('#sKeyDel'), st = $('#sKeyStatus'), inline = $('#sKey').parentElement, rep = $('#sKeyReplace');
  if(!SERVER){ row.hidden = false; del.hidden = true; st.textContent = ''; inline.hidden = false; rep.hidden = true; return; }
  const p = llmConns.find(x => x.id === $('#sProvider').value);
  row.hidden = true; del.hidden = !(p && p.source && p.source !== 'env');
  const saved = !!(p && p.source);
  if(!saved) ui.replacingKey = false;
  inline.hidden = saved && !ui.replacingKey;
  rep.hidden = !(saved && p.source !== 'env' && !ui.replacingKey);
  st.textContent = !p ? '' : p.source ? t('set.keySaved', {source:t('set.src.' + p.source)}) : (p.needsKey ? t('set.keyNone') : t('set.keyOptional'));
  $('#sKey').placeholder = p && p.source ? '••••••••' : (p && p.type === 'gemini' ? 'AIza…' : p && p.type === 'anthropic' ? 'sk-ant-…' : 'sk-…');
 },
 keyFieldVis(){ $('#keyField').style.display = $('#sProvider').value === 'demo' ? 'none' : ''; ui.replacingKey = false; ui.keyStatus(); $('#sKey').value = SERVER ? '' : $('#sKey').value; },

 provManager(){
  $('#provList').innerHTML = llmConns.map(c => `<div class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="flex:1"><b>${esc(c.label)}</b> <span class="muted">${esc(c.type)}${c.baseUrl ? ' · ' + esc(c.baseUrl) : ''} · ${c.source ? '✓ ' + esc(t('set.src.' + c.source)) : (c.needsKey ? esc(t('set.keyNone')) : esc(t('set.keyOptional')))}</span></span><button class="btn" type="button" data-pdel="${esc(c.id)}">${esc(t('set.keyDelete'))}</button></div>`).join('');
  $('#pType').innerHTML = llmTypes.map(x => `<option value="${esc(x.type)}">${esc(x.label)}</option>`).join('');
  ui.provTypeHint();
 },
 provTypeHint(){
  const x = llmTypes.find(y => y.type === $('#pType').value);
  $('#pUrl').placeholder = x ? x.defaultBaseUrl : '';
  $('#pHint').textContent = t('prov.hint.' + $('#pType').value);
 },
 customLangVis(){ $('#sTeamLangCustom').hidden = $('#sTeamLang').value !== 'other'; },
 settingsSave(){
  const snap = () => JSON.stringify([settings.level, settings.domainLevels, settings.uiLang, settings.teamLang, settings.teamLangCustom]);
  const before = snap();
  settings.uiLang = LANGS[$('#sUiLang').value] ? $('#sUiLang').value : 'en';
  settings.teamLang = $('#sTeamLang').value; settings.teamLangCustom = $('#sTeamLangCustom').value.trim();
  settings.provider = $('#sProvider').value; settings.apiKey = SERVER ? '' : $('#sKey').value.trim(); settings.rememberKey = $('#sRemember').checked;
  settings.model = $('#sModel').value.trim() || DEFAULT_SETTINGS.model; settings.level = $('#sLevel').value;
  settings.domainLevels = {}; document.querySelectorAll('[data-dl]').forEach(s => { if(s.value) settings.domainLevels[s.dataset.dl] = s.value; });
  settings.roleModels = {}; document.querySelectorAll('[data-rm]').forEach(i => { if(i.value.trim()) settings.roleModels[i.dataset.rm] = {provider:(document.querySelector(`[data-rmp="${i.dataset.rm}"]`) || {}).value || '', model:i.value.trim()}; });
  settings.maxRounds = Math.min(5, Math.max(1, +$('#sRounds').value || 2)); settings.rpm = Math.min(120, Math.max(1, +$('#sRpm').value || 8));
  settings.temperature = Math.min(2, Math.max(0, +$('#sTemp').value));
  settings.economy = $('#sEconomy').checked; settings.verifyRenderings = $('#sVerify').checked;
  saveSettings(); $('#settingsOv').classList.remove('on');
  applyI18n(); ui.all();
  if(before !== snap()) run(() => ensureRenderings(pendingQs()));
 },
 all(){ ui.top(); ui.renderFeed(); ui.side(); ui.actions(); }
};
const COMMENT_LABEL = type => ['question', 'objection', 'suggestion', 'answer'].includes(type) ? t('ctype.' + type) : String(type || '');

/* ===== EVENTS ===== */
function welcome(){ addMsg({kind:'agent', author:'sm', key:'sm.welcome'}); }
function startNew(){
 if(busy){ alert(t('alert.busy')); return; }
 const keep = {contextMode:session.contextMode, projectContext:session.projectContext};
 session = Object.assign(newSession(), keep); lastFailed = null; ui.tab = 'team'; save(); ui.all(); welcome();
 if(SERVER){ progress = {stories:{}, questions:[], blockers:[]}; fetch('/api/progress', {method:'DELETE'}).catch(() => {}); }
}
document.addEventListener('click', e => {
 const tab = e.target.closest('[data-tab]');
 if(tab){ ui.tab = tab.dataset.tab; ui.side(); return; }
 const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
 const q = b.dataset.q;
 switch(b.dataset.act){
  case 'team-confirm': confirmTeam(); break;
  case 'opt': choose(q, b.dataset.o); break;
  case 'delegate': { const qq = findQ(q); if(qq) choose(q, recId(qq), true); break; }
  case 'custom': proposeCustom(q, b.closest('.qcard').querySelector('.custin').value); break;
  case 'cust-yes': confirmCustom(q, true); break;
  case 'cust-no': confirmCustom(q, false); break;
  case 'continue': continueUnanswered(); break;
  case 'stop': stopRequested = true; queue.length = 0; ui.status(t('status.stopping')); break;
  case 'retry': if(lastFailed){ const f = lastFailed; lastFailed = null; run(f); } break;
  case 'export-json': download(`ai-scrum-${slug()}.json`, JSON.stringify(session, null, 2), 'application/json'); break;
  case 'export-md': download(`AI_TEAM_HANDOFF-${slug()}.md`, handoffMD(), 'text/markdown'); break;
  case 'connect': connectIde(b.dataset.ide); break;
  case 'rb-edit': rbEdit(b.dataset.role, b.dataset.id); break;
  case 'rb-remove': rbRemove(b.dataset.role, b.dataset.id); break;
  case 'rb-add': rbAdd(b.dataset.role); break;
  case 'tc-edit': tcStartEdit(b.dataset.id); break;
  case 'tc-add': tcStartEdit('', b.dataset.story); break;
  case 'tc-save': tcSave(); break;
  case 'tc-cancel': tcCancel(); break;
  case 'tc-manual': tcMakeManual(b.dataset.id); break;
  case 'tc-remove': tcRemove(b.dataset.id); break;
  case 'tc-code': showTestCode(b.dataset.id); break;
  case 'tc-replace': { const remark = prompt(t('tc.replacePrompt')); if(remark === null) break; if(busy){ alert(t('alert.busy')); break; } run(() => tcReplace(b.dataset.id, remark.trim())); break; }
  case 'qa-create': if(busy){ alert(t('alert.busy')); break; } run(async () => { await doQaPlan(); if(!session.plan.check) await doPlanCheck(); setPhase('done'); ui.side(); }); break;
  case 'as-confirm': resolveAssumptionUI(b.dataset.id, 'confirm'); break;
  case 'as-reject': resolveAssumptionUI(b.dataset.id, 'reject'); break;
  case 'pc-apply': applyPlanCheck(b.dataset.issue, +b.dataset.opt); break;
  case 'pc-run': if(busy){ alert(t('alert.busy')); break; } session.plan.check = null; save(); ui.side(); run(doPlanCheck); break;
  case 'verify-approve': approveVerify(); break;
  case 'verify-revoke': revokeVerify(); break;
  case 'manual-toggle': session.manualChecks = session.manualChecks || {}; session.manualChecks[b.dataset.tc] = b.checked; save(); break;
  case 'ctx-mode': session.contextMode = b.dataset.mode; save(); ui.side(); break;
  case 'ctx-analyze': analyzeContext(); break;
  case 'ctx-scan': scanContext(); break;
  case 'ctx-copy': navigator.clipboard.writeText(ANALYZE_CMD).then(() => { ctxMsg = t('ctx.copied') + ' «' + ANALYZE_CMD.slice(0, 48) + '…»'; ui.side(); }).catch(() => { ctxMsg = ANALYZE_CMD; ui.side(); }); break;
  case 'ctx-save': saveContext(false); break;
  case 'ctx-confirm': saveContext(true); break;
  case 'ap-start': if(confirm(t('ap.confirm'))) autopilotCall('start', $('#apAgent').value); break;
  case 'ap-stop': autopilotCall('stop'); break;
  case 'copy-prompt': navigator.clipboard.writeText(START_PROMPT).then(() => { connectMsg = t('conn.copied') + ' «' + START_PROMPT.slice(0, 48) + '…»'; ui.side(); }).catch(() => { connectMsg = START_PROMPT; ui.side(); }); break;
  case 'import-json': $('#importFile').click(); break;
  case 'new': if(confirm(t('confirm.new'))) startNew(); break;
 }
});
document.addEventListener('change', e => {
 const el = e.target;
 if(el.dataset.team !== undefined){ const it = session.proposedTeam[+el.dataset.team]; if(it){ it.selected = el.checked; save(); } }
 if(el.dataset.addrole !== undefined && el.value){ session.proposedTeam.push({role:el.value, reason:'', reasonKey:'team.addedByPO', selected:true}); save(); ui.refreshKind('team'); }
});
document.addEventListener('keydown', e => {
 if(e.target.classList && e.target.classList.contains('custin') && e.key === 'Enter'){ e.preventDefault(); proposeCustom(e.target.dataset.q, e.target.value); }
});
const input = $('#input');
function send(){ const v = input.value; if(!v.trim()) return; input.value = ''; input.style.height = ''; onSend(v); }
$('#btnSend').onclick = send;
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });
$('#qlevel').onchange = e => setLevel(e.target.value, true);
$('#btnSettings').onclick = ui.settingsOpen;
$('#btnSide').onclick = () => $('#side').classList.toggle('on');
$('#sCancel').onclick = () => $('#settingsOv').classList.remove('on');
// In the local app a typed key goes to the server first (and is cleared from the form); then the other settings are saved.
// How long the IDE agent waits inside a question for the answer of the Product Owner (a setting of the user, kept by the app).
let waitLoaded = null;
async function loadWait(){
 try{
  const r = await fetch('/api/settings', {cache:'no-store'}); if(!r.ok) return;
  const j = await r.json();
  waitLoaded = j.waitSeconds;
  $('#sWait').value = j.waitSeconds; $('#sWait').disabled = !!j.fromEnvironment;
  $('#sWaitHint').textContent = t(j.fromEnvironment ? 'set.waitEnv' : 'set.waitHint', {n:j.defaultWaitSeconds});
 }catch(e){}
}
async function saveWait(){
 if(!SERVER || $('#sWait').disabled) return;
 const v = Math.round(+$('#sWait').value);
 if(!Number.isFinite(v) || v === waitLoaded) return;
 const r = await fetch('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({waitSeconds:v})});
 if(!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.error || r.status); }
 waitLoaded = v;
}
$('#sSave').onclick = async () => {
 try{ await saveWait(); }catch(e){ alert(t('set.waitFail', {e:e.message})); return; }
 const typed = $('#sKey').value.trim();
 if(SERVER && typed && $('#sProvider').value !== 'demo'){
  try{ await putKey($('#sProvider').value, typed); $('#sKey').value = ''; await loadProviders(); ui.provManager(); }
  catch(e){ alert(t('set.keyFail', {e:e.message})); return; }
 }
 ui.settingsSave();
};
$('#sKeyDel').onclick = async () => {
 if(!confirm(t('set.keyDeleteConfirm'))) return;
 try{ await serverCall('/api/llm/key?provider=' + encodeURIComponent($('#sProvider').value), {method:'DELETE'}); await loadProviders(); ui.keyStatus(); ui.provManager(); ui.all(); }
 catch(e){ alert(t('set.keyFail', {e:e.message})); }
};
$('#sProvider').onchange = ui.keyFieldVis;
$('#pType').onchange = ui.provTypeHint;
$('#sKeyReplace').onclick = () => { ui.replacingKey = true; ui.keyStatus(); $('#sKey').focus(); };
$('#pAdd').onclick = async () => {
 const type = $('#pType').value, label = $('#pLabel').value.trim() || (llmTypes.find(x => x.type === type) || {}).label;
 try{
  const c = await serverCall('/api/llm/providers', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type, label, baseUrl:$('#pUrl').value.trim()})});
  await loadProviders(); $('#pLabel').value = ''; $('#pUrl').value = '';
  const keep = $('#sProvider').value;
  $('#sProvider').innerHTML = connList().map(x => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('') + `<option value="demo">${esc(t('set.providerDemo'))}</option>`;
  $('#sProvider').value = c.id; ui.keyFieldVis(); ui.provManager();
  if(keep && keep !== c.id) $('#pHint').textContent = t('prov.added', {name:c.label});
 }catch(e){ alert(t('prov.error', {e:e.message})); }
};
$('#provList').onclick = async e => {
 const id = e.target.dataset && e.target.dataset.pdel; if(!id) return;
 if(!confirm(t('prov.removeConfirm'))) return;
 try{
  await serverCall('/api/llm/providers?id=' + encodeURIComponent(id), {method:'DELETE'});
  await loadProviders();
  if(settings.provider === id) settings.provider = (llmConns[0] || {id:'demo'}).id;
  ui.settingsOpen();
 }catch(err){ alert(t('prov.error', {e:err.message})); }
};
// the model suggestions follow the provider of the field being edited
const modelCache = {};
async function fillModelList(pid){
 if(!pid || pid === 'demo' || !SERVER || !keyReady(pid)) return;
 if(!modelCache[pid]){ try{ modelCache[pid] = await serverProvider(pid).listModels(); }catch(e){ return; } }
 $('#modelList').innerHTML = modelCache[pid].map(m => `<option value="${esc(m)}">`).join('');
}
document.addEventListener('focusin', e => {
 const el = e.target;
 if(el.dataset && el.dataset.rm) fillModelList((document.querySelector(`[data-rmp="${el.dataset.rm}"]`) || {}).value || $('#sProvider').value);
 else if(el.id === 'sModel') fillModelList($('#sProvider').value);
});
$('#sTeamLang').onchange = ui.customLangVis;
$('#sKeyShow').onclick = () => { const k = $('#sKey'); k.type = k.type === 'password' ? 'text' : 'password'; applyI18n(); };
$('#sLoadModels').onclick = async () => {
 const hint = $('#sModelHint'), prov = $('#sProvider').value;
 hint.textContent = t('set.loading');
 try{
  const typed = $('#sKey').value.trim();
  if(SERVER && typed && prov !== 'demo'){ await putKey(prov, typed); $('#sKey').value = ''; await loadProviders(); ui.keyStatus(); ui.provManager(); }
  const list = await (prov === 'demo' ? Providers.demo : SERVER ? serverProvider(prov) : Providers.gemini).listModels(typed);
  $('#modelList').innerHTML = list.map(m => `<option value="${esc(m)}">`).join('');
  hint.textContent = t('set.modelsFound', {n:list.length});
 }catch(err){ hint.textContent = t('set.modelsFail', {e:err.message}); }
};
$('#importFile').onchange = async e => {
 const f = e.target.files[0]; e.target.value = ''; if(!f) return;
 try{
  const obj = JSON.parse(await f.text());
  if(obj.schema !== SCHEMA) throw new Error(t('err.importSchema', {schema:SCHEMA}));
  if(busy) throw new Error(t('err.importBusy'));
  session = obj; save(); lastFailed = RESUME[session.phase] || null; ui.all();
  if(lastFailed) addMsg({kind:'sys', key:'sys.imported'});
 }catch(err){ alert(t('err.import', {e:err.message})); }
};

/* ===== INIT ===== */
applyI18n();
ui.all();
if(SERVER) loadProviders().then(migrateKey).then(() => { ui.all(); });
if(!session.messages.length) welcome();
else if(RESUME[session.phase]){ lastFailed = RESUME[session.phase]; addMsg({kind:'sys', key:'sys.resume'}); ui.actions(); }

</script>
</body>
