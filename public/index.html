<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrumBridge</title>
<style>
:root{--bg:#f5f5f5;--panel:#fff;--panel2:#fafafa;--text:#242424;--muted:#616161;--line:#e1e1e1;--accent:#5b5fc7;--accent2:#4f52b2;--accent-weak:#e8ebfa;--mine:#e8ebfa;--warn:#c4314b;--warn-weak:#fdf3f4;--ok:#0e7a0d;--ok-weak:#f1faf1;--rec:#8a6100;--rec-weak:#fff8e6;--shadow:0 1px 2px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1b;--panel:#262626;--panel2:#2e2e2e;--text:#ededed;--muted:#a8a8a8;--line:#3a3a3a;--accent:#7f85f5;--accent2:#9299f7;--accent-weak:#2f3150;--mine:#34365a;--warn:#f1707b;--warn-weak:#3a2326;--ok:#6ccb5f;--ok-weak:#1f3320;--rec:#f2c661;--rec-weak:#3a3220;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.ptitle{color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.step{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.step.done{color:var(--ok);background:var(--ok-weak);border-color:transparent}
.step.cur{color:#fff;background:var(--accent);border-color:var(--accent)}
.topctl{display:flex;gap:8px;align-items:center}
.topctl label{font-size:12px;color:var(--muted)}
select,input[type=text],input[type=password],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:none;cursor:pointer;font-size:18px;padding:4px 6px;border-radius:6px;color:var(--muted)}
.iconbtn:hover{background:var(--panel2);color:var(--text)}
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.feed{flex:1;overflow-y:auto;padding:16px 20px 8px}
.msg{display:flex;gap:10px;margin:0 0 14px;max-width:880px}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.av.sm{width:24px;height:24px;font-size:9px}
.body{min-width:0;flex:1}
.mh{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:3px;flex-wrap:wrap}
.mh b{color:var(--text);font-size:13px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.warn{color:var(--warn);background:var(--warn-weak);border-color:transparent}
.tag.lvl{color:var(--accent);background:var(--accent-weak);border-color:transparent}
.bubble{background:var(--panel);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.msg.mine .mh{justify-content:flex-end}
.msg.mine .bubble{background:var(--mine);border-color:transparent}
.bubble p{margin:0 0 4px}.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:4px 0;padding-left:20px}
.mdh{font-weight:600;margin:6px 0 2px}
.gap{height:6px}
code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
details{margin-top:6px}
details>summary{cursor:pointer;color:var(--accent);font-size:12px;user-select:none}
details.think>summary{color:var(--muted)}
details[open]>summary{margin-bottom:4px}
details.think[open]{background:var(--panel2);border-radius:6px;padding:6px 8px;color:var(--muted)}
.sys{text-align:center;color:var(--muted);font-size:12px;margin:10px auto 16px;max-width:640px}
.sys p{margin:0}
.sys.err{color:var(--warn);background:var(--warn-weak);border-radius:6px;padding:6px 10px}
.card,.qcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}
.qcard{border-left:3px solid var(--accent)}
.qcard.done{border-left-color:var(--ok)}
.cardh{font-weight:600;margin-bottom:6px}
.qhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:4px}
.qid{font-weight:700;color:var(--accent)}
.qtopic{font-weight:600;margin:2px 0}
.qtext{margin-bottom:8px}
.qtext p{margin:0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 10px;cursor:pointer;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.chosen{border-color:var(--ok);background:var(--ok-weak)}
.opt .ol{font-weight:700;color:var(--accent);flex:none}
.opt .ot{flex:1}
.rectag,.custtag{display:inline-block;margin-left:8px;font-size:11px;padding:0 7px;border-radius:999px;color:var(--rec);background:var(--rec-weak)}
.custtag{color:var(--accent);background:var(--accent-weak)}
.recnote{font-size:12px;color:var(--muted);margin-top:6px}
.qactions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qactions input{flex:1;min-width:160px}
.answered{margin-top:8px;color:var(--ok);font-size:13px}
.pending{margin-top:8px;padding:8px;border-radius:6px;background:var(--accent-weak)}
.pending .row{display:flex;gap:6px;margin-top:6px}
.warnline{font-size:12px;color:var(--warn);margin-bottom:6px}
.muted{color:var(--muted)}.small{font-size:12px}
.trow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.trow:last-of-type{border-bottom:none}
.addrole{margin:8px 0}
.typing{padding:4px 20px;font-size:12px;color:var(--muted);min-height:22px;display:flex;align-items:center;gap:8px}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-right:2px;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.actions{display:flex;gap:8px;align-items:center;padding:6px 20px;flex-wrap:wrap}
.actions[hidden]{display:none}
.composer{display:flex;gap:8px;padding:8px 20px 16px}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:180px;border-radius:8px;padding:10px 12px}
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:none;background:none;padding:10px 4px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.sidebody{flex:1;overflow-y:auto;padding:12px 14px}
.sidebody h3{font-size:13px;margin:14px 0 6px}
.sidebody h3:first-child{margin-top:0}
.item{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.item:last-child{border-bottom:none}
.row2{display:flex;gap:8px;align-items:flex-start}
.story{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:6px 0;font-size:13px;background:var(--panel2)}
.story .sh{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.sp{margin-left:auto;font-size:11px;padding:0 6px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:var(--panel2);border-radius:6px;padding:6px 8px}
.stat b{display:block;font-size:16px}
.stack{display:flex;flex-direction:column;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10}
.overlay.on{display:flex}
.modal{background:var(--panel);border-radius:10px;max-width:640px;width:100%;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal h2{margin:0 0 12px;font-size:18px}
.field{margin-bottom:12px}
.field>label{display:block;font-weight:600;margin-bottom:4px;font-size:13px}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.field input[type=text],.field input[type=password],.field select{width:100%}
.inline{display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.grid2 label{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:6px;align-items:center;font-weight:400 !important}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
a{color:var(--accent)}
.sidetoggle{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;right:0;top:0;bottom:0;width:min(380px,92vw);z-index:5;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 20px rgba(0,0,0,.2)}
 .side.on{transform:none}
 .sidetoggle{display:inline-block}
 .steps{order:5;width:100%;margin-left:0}
 .feed,.actions,.composer,.typing{padding-left:12px;padding-right:12px}
}
.langrow{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.langrow input{grid-column:1/-1}
.field>label.sub{font-weight:400;color:var(--muted);font-size:12px}

</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand"><div class="logo">AI</div>ScrumBridge</div>
  <div class="ptitle" id="ptitle"></div>
  <div class="steps" id="steps"></div>
  <div class="topctl">
   <label for="qlevel" data-i18n="top.level"></label>
   <select id="qlevel" data-i18n-title="top.levelTitle"></select>
   <button class="iconbtn" id="btnSettings" data-i18n-title="top.settings">⚙</button>
   <button class="iconbtn sidetoggle" id="btnSide" data-i18n-title="top.panel">☰</button>
  </div>
 </header>
 <main class="chat">
  <div class="feed" id="feed"></div>
  <div class="typing" id="typing"></div>
  <div class="actions" id="actions" hidden></div>
  <div class="composer">
   <textarea id="input" rows="1"></textarea>
   <button class="btn primary" id="btnSend" data-i18n="composer.send"></button>
  </div>
 </main>
 <aside class="side" id="side">
  <div class="tabs" id="tabs"></div>
  <div class="sidebody" id="sidebody"></div>
 </aside>
</div>

<div class="overlay" id="settingsOv">
 <div class="modal">
  <h2 data-i18n="set.title"></h2>

  <div class="field">
   <label for="sUiLang" data-i18n="set.uiLang"></label>
   <select id="sUiLang"></select>
  </div>
  <div class="field">
   <label for="sTeamLang" data-i18n="set.teamLang"></label>
   <div class="langrow">
    <select id="sTeamLang"></select>
    <input type="text" id="sTeamLangCustom" data-i18n-ph="set.teamLangCustomPh" hidden>
   </div>
   <div class="hint" data-i18n="set.teamLangHint"></div>
  </div>

  <div class="field">
   <label for="sProvider" data-i18n="set.provider"></label>
   <select id="sProvider"></select>
   <div class="hint" data-i18n="set.providerHint"></div>
  </div>
  <details class="field" id="provMgr" hidden>
   <summary data-i18n="prov.manage"></summary>
   <div id="provList" style="margin:8px 0"></div>
   <div class="grid2">
    <label for="pType" data-i18n="prov.type"></label><select id="pType"></select>
    <label for="pLabel" data-i18n="prov.label"></label><input type="text" id="pLabel">
    <label for="pUrl" data-i18n="prov.url"></label><input type="text" id="pUrl">
   </div>
   <div class="hint" id="pHint"></div>
   <button class="btn" id="pAdd" type="button" data-i18n="prov.add" style="margin-top:6px"></button>
  </details>
  <div class="field" id="keyField">
   <label for="sKey" data-i18n="set.key"></label>
   <div class="inline"><input type="password" id="sKey" autocomplete="off" placeholder="AIza…"><button class="btn" id="sKeyShow" type="button"></button></div>
   <div class="hint" id="sKeyStatus"></div>
   <div class="inline" style="margin-top:6px"><button class="btn" id="sKeyReplace" type="button" hidden></button><button class="btn" id="sKeyDel" type="button" hidden></button></div>
   <label class="chk" id="sRememberRow" style="margin-top:6px"><input type="checkbox" id="sRemember"> <span data-i18n="set.remember"></span></label>
   <div class="hint" id="sKeyHint" data-i18n-html="set.keyHint"></div>
  </div>
  <div class="field">
   <label for="sModel" data-i18n="set.model"></label>
   <div class="inline"><input type="text" id="sModel" list="modelList"><button class="btn" id="sLoadModels" type="button" data-i18n="set.loadModels"></button></div>
   <datalist id="modelList"></datalist>
   <div class="hint" id="sModelHint" data-i18n="set.modelHint"></div>
  </div>
  <details class="field">
   <summary data-i18n="set.roleModels"></summary>
   <div class="grid2" id="sRoleModels" style="margin-top:8px"></div>
  </details>
  <div class="field">
   <label data-i18n="set.levelH"></label>
   <div class="grid2">
    <label for="sLevel" data-i18n="set.levelGeneral"></label><select id="sLevel"></select>
   </div>
   <details><summary data-i18n="set.levelByDomain"></summary><div class="grid2" id="sDomainLevels" style="margin-top:8px"></div></details>
  </div>
  <div class="field">
   <label data-i18n="set.processH"></label>
   <div class="grid2">
    <label for="sRounds" data-i18n="set.rounds"></label><input type="number" id="sRounds" min="1" max="5">
    <label for="sRpm" data-i18n="set.rpm"></label><input type="number" id="sRpm" min="1" max="120">
    <label for="sTemp" data-i18n="set.temp"></label><input type="number" id="sTemp" min="0" max="2" step="0.1">
    <label for="sWait" data-i18n="set.wait" class="srvonly"></label><input type="number" id="sWait" min="5" max="3600" class="srvonly">
   </div>
   <label class="chk" style="margin-top:8px"><input type="checkbox" id="sEconomy"> <span data-i18n="set.economy"></span></label>
   <label class="chk"><input type="checkbox" id="sVerify"> <span data-i18n="set.verify"></span></label>
   <div class="hint" data-i18n="set.processHint"></div>
   <div class="hint srvonly" id="sWaitHint"></div>
  </div>
  <div class="mfoot"><button class="btn" id="sCancel" data-i18n="set.cancel"></button><button class="btn primary" id="sSave" data-i18n="set.save"></button></div>
 </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
// The local app tells every tab which project it serves; the server refuses writes from a tab of another project.
if(window.__AIST_PROJECT__){
 const nativeFetch = window.fetch.bind(window);
 window.fetch = (u, o) => {
  if(typeof u === 'string' && u.startsWith('/api')) o = Object.assign({}, o, {headers:Object.assign({'X-Aist-Project':window.__AIST_PROJECT__}, (o && o.headers) || {})});
  return nativeFetch(u, o);
 };
}
/* ===== I18N =====
   UI strings per language. English is the source of truth and the fallback for any
   missing key. demo.* and dq.* (demo-mode stub texts) exist in en and ru only; other
   languages fall back to English there. To add a language: add an entry to LANGS and
   LANG_EN, then an I18N.<code> block (tools: build.py checks that every key is present). */
const LANGS = {en:'English', ru:'Русский', uk:'Українська', es:'Español', de:'Deutsch', fr:'Français'};
const LANG_EN = {en:'English', ru:'Russian', uk:'Ukrainian', es:'Spanish', de:'German', fr:'French'}; // names used inside prompts
const I18N = {};

function tl(lang, key, p){
 const d = I18N[lang];
 let s = d && d[key] !== undefined ? d[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
 if(p) s = s.replace(/\{(\w+)\}/g, (m, k) => p[k] !== undefined ? p[k] : m);
 return s;
}

/* =====================================================================
   ScrumBridge — planning-phase prototype.
   Layers: CONFIG → LANGUAGE → PROVIDERS → LLM → PROMPTS → DEMO → STATE →
   ORCHESTRATOR → UI. Everything except UI is DOM-free (apart from the
   ui.* hooks) and can move into a server-side MCP server for IDEs
   without changing logic. Session format: ai-scrum-session/1.
   Localization: UI strings live in I18N (i18n.js). Prompts are English;
   the language of the team's replies is a separate setting.
   ===================================================================== */

/* ===== CONFIG ===== */

/* ===== UTIL ===== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const arr = v => Array.isArray(v) ? v : [];
const LS = {
 get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
 set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function md(src){
 if(!src) return '';
 const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<i>$2</i>');
 let out = '', inList = false;
 for(const raw of esc(String(src)).split(/\r?\n/)){
  const l = raw.trimEnd();
  const li = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
  if(li){ if(!inList){ out += '<ul>'; inList = true; } out += '<li>' + inline(li[1]) + '</li>'; continue; }
  if(inList){ out += '</ul>'; inList = false; }
  const h = l.match(/^#{1,4}\s+(.*)/);
  if(h){ out += '<div class="mdh">' + inline(h[1]) + '</div>'; continue; }
  if(!l.trim()){ out += '<div class="gap"></div>'; continue; }
  out += '<p>' + inline(l) + '</p>';
 }
 if(inList) out += '</ul>';
 return out;
}
function parseJSON(text){
 const s = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
 try{ return JSON.parse(s); }catch(e){}
 const a = s.indexOf('{'), b = s.lastIndexOf('}');
 if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b + 1)); }catch(e){} }
 return null;
}

/* ===== SETTINGS & LANGUAGE ===== */
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get(LS_SETTINGS, {}));
delete settings.lang; // v0.1 setting, replaced by uiLang / teamLang
for(const r of Object.keys(settings.roleModels || {})) if(typeof settings.roleModels[r] === 'string') settings.roleModels[r] = {provider:'', model:settings.roleModels[r]};
if(!LANGS[settings.uiLang]) settings.uiLang = 'en';
function saveSettings(){
 const copy = Object.assign({}, settings);
 if(SERVER || !copy.rememberKey) copy.apiKey = '';
 LS.set(LS_SETTINGS, copy);
}
const levelFor = domain => settings.domainLevels[domain] || settings.level;

   Adapter: generate({model, system, prompt, json, temperature, apiKey, task, ctx}) → {text, usage:{in,out}} */
const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta';
function geminiRetryDelay(data){
 const d = arr(data?.error?.details).find(x => String(x['@type'] || '').includes('RetryInfo'));
 return d && d.retryDelay ? parseFloat(d.retryDelay) * 1000 : 0;
}
// Tells "host unreachable" (blocker, VPN, firewall, preview CSP) from "host reachable but response rejected" (CORS).
async function diagnoseNetwork(){
 const where = location.protocol === 'file:' ? t('err.localFile') : location.origin;
 let reachable = true;
 try{ await fetch('https://generativelanguage.googleapis.com/', {mode:'no-cors', cache:'no-store'}); }catch(e){ reachable = false; }
 return t(reachable ? 'err.netCors' : 'err.netBlocked', {where});
}
// Local app: the server holds the keys and calls the provider (/api/llm/*); the browser never sees a key.
async function serverCall(path, opts){
 let res;
 try{ res = await fetch(path, opts); }
 catch(e){ const err = new Error(t('err.serverDown')); err.status = 0; throw err; }
 const data = await res.json().catch(() => ({}));
 if(!res.ok){
  const e = data && typeof data.error === 'object' ? data.error : {message:data && data.error};
  const status = e.status !== undefined ? e.status : res.status;
  let msg = e.message || ('HTTP ' + res.status);
  if(res.status === 401 && /no API key/i.test(msg)) msg = t('err.noKey');
  else if(res.status === 401) msg = t('err.unauthorized');
  else if(status === 404) msg += t('err.model404');
  else if(status === 400 && /api key/i.test(msg)) msg = t('err.badKey');
  const err = new Error(msg); err.status = status; err.retryAfter = e.retryAfter || 0; err.daily = !!e.daily;
  throw err;
 }
 return data;
}
const serverGenerate = (provider, {model, system, prompt, json, temperature}) =>
 serverCall('/api/llm/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({provider, model, system, prompt, json, temperature})});
let llmConns = [], llmTypes = [], llmLoaded = false;
async function loadProviders(){
 try{ const r = await fetch('/api/llm/providers'); if(r.ok){ const j = await r.json(); llmConns = j.connections; llmTypes = j.types; llmLoaded = true; } }catch(e){}
}
// Is there a key for the current provider? (before the list is loaded, assume yes)
const connList = () => SERVER ? llmConns : [{id:'gemini', type:'gemini', label:t('set.providerGemini'), needsKey:true, hasKey:!!settings.apiKey, source:null}];
const connLabel = id => id === 'demo' ? t('side.demoModel') : ((connList().find(c => c.id === id) || {}).label || id);
const keyReady = (pid = settings.provider) => {
 if(pid === 'demo') return true;
 if(!SERVER) return !!settings.apiKey;
 if(!llmLoaded) return true;
 const p = llmConns.find(x => x.id === pid);
 return !p || p.hasKey;
};
// Which provider and model a role uses: its own choice if set, otherwise the defaults. Demo mode overrides everything.
function roleTarget(role){
 if(settings.provider === 'demo') return {provider:'demo', model:'demo'};
 const rm = settings.roleModels[role];
 if(rm && rm.model){
  const p = rm.provider && connList().some(c => c.id === rm.provider) ? rm.provider : settings.provider;
  return {provider:p, model:rm.model};
 }
 return {provider:settings.provider, model:settings.model};
}

async function migrateKey(){

const Providers = {
 gemini: {
  async generate({model, system, prompt, json, temperature, apiKey}){
   if(SERVER) return serverGenerate('gemini', {model, system, prompt, json, temperature});
   const url = `${GEMINI_BASE}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
   const body = {contents:[{role:'user', parts:[{text:prompt}]}], systemInstruction:{parts:[{text:system}]}, generationConfig:{temperature}};
   if(json) body.generationConfig.responseMimeType = 'application/json';
   let res;
   try{ res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); }
   catch(e){ const err = new Error(t('err.network', {diag:await diagnoseNetwork()})); err.status = 0; throw err; }
   const data = await res.json().catch(() => ({}));
   if(!res.ok){
    let msg = data?.error?.message || ('HTTP ' + res.status);
    if(res.status === 404) msg += t('err.model404');
    if(res.status === 400 && /api key/i.test(msg)) msg = t('err.badKey');
    const err = new Error(msg); err.status = res.status; err.retryAfter = geminiRetryDelay(data);
    err.daily = /per\s*day|PerDay/i.test(JSON.stringify(data?.error || {}));
    throw err;
   }
   const cand = data.candidates && data.candidates[0];
   const text = arr(cand?.content?.parts).filter(p => !p.thought && p.text).map(p => p.text).join('');
   if(!text) throw new Error(t('err.empty', {why:data.promptFeedback?.blockReason || cand?.finishReason || t('err.unknown')}));
   const u = data.usageMetadata || {};
   return {text, usage:{in:u.promptTokenCount || 0, out:(u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0)}};
  },
  async listModels(apiKey){
   if(SERVER) return (await serverCall('/api/llm/models?provider=gemini')).models;
   if(!apiKey) throw new Error(t('err.keyFirst'));
   let res;
   try{ res = await fetch(`${GEMINI_BASE}/models?pageSize=200&key=${encodeURIComponent(apiKey)}`); }
   catch(e){ throw new Error(await diagnoseNetwork()); }
   const data = await res.json().catch(() => ({}));
   if(!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
   return arr(data.models).filter(m => arr(m.supportedGenerationMethods).includes('generateContent')).map(m => String(m.name).replace(/^models\//, ''));
  }
 },
 demo: {
  async generate({task, ctx}){
   await sleep(350 + Math.random() * 400);
   const fn = Demo[task];
   if(!fn) throw new Error(t('err.demoMissing', {task}));
   return {text:JSON.stringify(fn(ctx || {})), usage:{in:0, out:0}};
  },
  async listModels(){ return ['demo']; }
 }
};

/* ===== LLM: queue, rate limit, retries ===== */
let stopRequested = false;
function checkStop(){ if(stopRequested){ stopRequested = false; throw new Error(t('err.stopped')); } }
const LLM = {
 last: {},
 async call(opts){
  const pid = opts.provider || settings.provider;
  const provider = pid === 'demo' ? Providers.demo : (SERVER ? serverProvider(pid) : Providers.gemini);
  if(SERVER && !llmLoaded) await loadProviders();
  if(!keyReady(pid)) throw new Error(t('err.noKey'));
  const conn = connList().find(c => c.id === pid);
  const interval = pid === 'demo' || (conn && conn.needsKey === false) ? 0 : 60000 / Math.max(1, +settings.rpm || 8); // a local server needs no pacing
  for(let attempt = 0; attempt < 4; attempt++){
   checkStop();
   const wait = (this.last[pid] || 0) + interval - Date.now();
   if(wait > 0){ ui.status(t('status.pause', {s:Math.ceil(wait / 1000)})); await sleep(wait); ui.status(''); }
   checkStop();
   this.last[pid] = Date.now();
   try{
    const r = await provider.generate(Object.assign({apiKey:settings.apiKey, temperature:+settings.temperature || 0.7}, opts));
    session.usage.requests++; session.usage.inTokens += r.usage.in; session.usage.outTokens += r.usage.out;
    ui.stats();
    return r;
   }catch(e){
    const retriable = [429, 500, 503].includes(e.status) && !e.daily;
    if(!retriable || attempt === 3) throw e;
    const d = Math.min(e.retryAfter || 5000 * 2 ** attempt, 90000);
    ui.status(t('status.retry', {s:Math.ceil(d / 1000)}));
    await sleep(d); ui.status('');
   }
  }
 }
};
async function callJSON({task, role = 'sm', system, prompt, ctx = {}}){
 const ask = async target => {
  const base = {task, provider:target.provider, model:target.model, system, prompt, json:true, ctx};
  let r = await LLM.call(base);
  let obj = parseJSON(r.text);
  if(!obj){
   r = await LLM.call(Object.assign({}, base, {prompt: prompt + '\n\nIMPORTANT: your previous answer was not valid JSON. Return only a valid JSON object matching the schema.'}));
   obj = parseJSON(r.text);
  }
  if(!obj) throw new Error(t('err.json', {task}));
  return obj;
 };
 const own = roleTarget(role);
 const dflt = settings.provider === 'demo' ? own : {provider:settings.provider, model:settings.model};
 try{ return await ask(own); }
 catch(e){
  // The model chosen for this role does not answer (overloaded, retired, no key): the step goes on with the default
  // model instead of stopping the whole work, and the Product Owner is told.
  if((own.provider === dflt.provider && own.model === dflt.model) || e.message === t('err.stopped')) throw e;
  addMsg({kind:'sys', key:'sys.modelFallback', params:{role:roleName(role), from:own.model, to:dflt.model, why:String(e.message).slice(0, 140)}});
  return await ask(dflt);
 }
}

  return session.plan.epics.flatMap(e => arr(e.stories)).map(st => `${st.id}. ${st.title}\n${arr(st.acceptance).map((a, i) => `   [${i}] ${a}`).join('\n')}`).join('\n');
 },
 qaPlan(){
  const t = session.plan.tech || {};
  return `${P.brief()}${factsBlock()}\nPLAN OF THE TEAM — stories with their acceptance criteria (criteria are numbered from 0):\n${P.qaStories()}\n\nAGREED STACK: ${arr(t.stack).join('; ') || 'not decided'}\nCONVENTIONS: ${arr(t.conventions).join('; ') || '-'}\n
${securityBlock()}PHASE: test design. You are the QA engineer. The developer is an AI agent in an IDE who cannot ask you anything: your output is its binding test instruction, and "done" will be refused until every automated case passes.
Rules:
- Cover EVERY acceptance criterion with at least one test case (field "criterion" = the number of the criterion). Add negative and boundary cases where the criterion allows failure. Concrete data in every case, no code.
- The test framework and language MUST come from the agreed stack and the project context; never introduce a new tool. If the stack names no test tool, take the standard one of that stack and say so in the summary.
- Levels (test pyramid): unit for logic and rules; integration for files, database, modules; api for contracts; e2e only for the one or two main user paths; manual only for what cannot reasonably be automated (look and feel, usability) — then give manualReason.
- runCommand: ONE command that runs all automated tests and still prints readable results to the console. reportFile: the path where that same command writes a JUnit XML report, always inside .ai-team/ (for example .ai-team/junit.xml), never in the project root. The app uses the report to check EVERY case by its ID, so a command without a report is only a weak check: leave reportFile empty only if the framework cannot write JUnit without an extra package, and then say so in the summary. Known working patterns: node:test (Node 20+): node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.ai-team/junit.xml <test files or glob> ; pytest: pytest --junitxml=.ai-team/junit.xml ; vitest: npx vitest run --reporter=default --reporter=junit --outputFile.junit=.ai-team/junit.xml ; Maven and Gradle write JUnit XML by default (give their report path). The title of a case must NOT contain its ID.
- A case verifies a behavior of the product. Never write a case that runs other tests, checks that the test runner works, or checks coverage: those are gates, not cases.
- namingRule: every automated test name must start with its case ID. The app assigns the IDs as TC-<code>-<story>-<n> in the order of your cases for each story; the code is a short code of this plan, so the IDs are unique across plans of the same project (for example TC-${planTag()}-S1-1, TC-${planTag()}-S1-2).
- gates: the quality gates for "done". Every gate must be measurable and unambiguous: it names the metric, the threshold and the tool or command that measures it (for example: line coverage >= 85% and function coverage >= 85% measured by node --experimental-test-coverage; branch coverage is only reported). Never write vague gates such as good coverage. The developer agent will treat a gate as binding and must not reinterpret it.

Answer as JSON:
{"message":"2–3 sentences to the chat: the strategy in plain words","strategy":{"summary":"...","framework":"...","runCommand":"...","reportFile":"","namingRule":"...","levels":[{"level":"unit|integration|api|e2e|manual","why":"..."}]},"cases":[{"story":"S-1","criterion":0,"level":"unit","type":"positive|negative|boundary","title":"...","given":"...","when":"...","then":"...","manualReason":""}],"gates":["..."]}`;
 },
 qaGaps(missing){
  return `${P.brief()}\nPLAN:\n${P.qaStories()}\n\nThe test design left these acceptance criteria without any test case: ${missing.map(m => `${m.story}[${m.criterion}]`).join(', ')}.
Write ONLY the missing cases (same fields as before; each must name its story and criterion).

Answer as JSON: {"cases":[{"story":"S-1","criterion":0,"level":"unit","type":"positive","title":"...","given":"...","when":"...","then":"...","manualReason":""}]}`;
 },
 // The Scrum Master reviews the finished plan the way the IDE agent will meet it: what would make the agent fail or guess?
 planCheck(){
  const p = session.plan, tp = p.testPlan || {};
  const list = (title, items) => `${title}:\n${items.length ? items.map((x, i) => `   [${i}] ${x}`).join('\n') : '   (none)'}`;
  return `${P.brief()}${factsBlock()}\nPLAN — stories with acceptance criteria (criteria numbered from 0):\n${P.qaStories()}\n\n${list('DEFINITION OF DONE', arr(p.definitionOfDone).map(String))}\n${list('RISKS', arr(p.risks).map(r => String(r.text || r)))}\n${list('QUALITY GATES (from QA)', arr(tp.gates).map(String))}\nOUT OF SCOPE: ${arr((p.tech || {}).outOfScope).join('; ') || '-'}\n
${rbBlock()}
PHASE: plan check. The developer is an AI agent in an IDE. It builds exactly what the plan says, it cannot ask the team, and it will guess whatever is unclear. Find the defects that would make it fail or guess. Report ONLY these kinds:
- orphan: a Definition of Done item, quality gate, risk mitigation or instruction of a specialist (see INSTRUCTIONS OF THE SPECIALISTS) that needs work which NO story delivers (for example "CI runs on Node 18 and 20" when no story creates a CI pipeline).
- contradiction: stories or acceptance criteria that contradict each other, a decision of the log, the tech brief or the out-of-scope list.
- unmeasurable: an acceptance criterion or a quality gate that cannot be verified as written (vague words, no number, no way to measure).
For every issue give the options that make sense:
- add_story: a draft story that delivers the missing work (title, description, owner role id from the team, estimate 1/2/3/5/8/13, verifiable acceptance criteria).
- reword: the exact new wording (for criterion, dod, gate or risk issues).
- drop: remove the item (only for dod, gate or risk).
- manual: keep it as a manual check for the Product Owner.
Mark exactly one option as recommended. If the plan has no real defects, return an empty list; do not invent issues and do not repeat the same issue twice (at most 6).

Answer as JSON:
{"message":"1–2 sentences to the chat","issues":[{"kind":"orphan|contradiction|unmeasurable","text":"what is wrong, 1–2 sentences","ref":{"type":"dod|gate|risk|criterion","index":0,"story":"S-1"},"options":[{"action":"add_story|reword|drop|manual","label":"short button text","recommended":false,"rewrite":"","story":{"title":"...","description":"...","owner":"role id","estimate":2,"acceptance":["..."]}}]}]}`;
 },
 // QA writes ONE replacement for a case the Product Owner did not want
 qaReplace(old, remark){
  const c = `${old.id} [${old.level}, ${old.type}] ${old.title} — Given ${old.given}; When ${old.when}; Then ${old.then}`;
  return `${P.brief()}${factsBlock()}\nPLAN:\n${P.qaStories()}\n\nThe Product Owner rejected this test case:\n${c}\n${remark ? 'The remark of the Product Owner: ' + remark : 'Reason: it does not check a behavior of the product (it tests the tests, or it is not useful).'}\n\nWrite ONE replacement case for the same story (${old.story}) and the same acceptance criterion (number ${old.criterion}).\nRules: it verifies a behavior of the product; it never runs other tests, never checks the test runner or the coverage; concrete data, no code; the level follows the test pyramid; if no useful automated check exists for this criterion, make it manual and give manualReason. Do not write the ID.\n\nAnswer as JSON:\n{"case":{"level":"unit|integration|api|e2e|manual","type":"positive|negative|boundary","title":"...","given":"...","when":"...","then":"...","manualReason":""}}`;
 },
 chat(text){
  const L = settings.level;
  const recent = session.messages.slice(-14).map(m => ({m, s:msgPlain(m)})).filter(x => x.s).map(x => `${x.m.kind === 'user' ? 'PO' : roleName(x.m.author || 'sm', 'en')}: ${x.s.slice(0, 300)}`).join('\n');
  return `${P.brief()}\nCURRENT PHASE: ${session.phase}\nRECENT MESSAGES:\n${recent}\n\nThe Product Owner wrote: "${text}"
Answer briefly at their level ("${L}": ${LEVEL_GUIDE[L]}). If they ask to explain more simply or, conversely, to show technical details, set levelChange to "novice", "product" or "engineer", otherwise null. If the message changes requirements, say the team will take it into account in the next steps. If the message states a firm requirement, constraint or decision by the Product Owner (not a question or a remark), put it into "decision" as a short statement, otherwise null. IMPORTANT: from this chat you cannot change the plan, the stories or the test plan, and you must never say or imply that you did ("updated the plan", "changed the test cases"). A decision is only written into the decision log, which binds the developer agent; if the plan text says something else, the decision wins. Say exactly that when it matters.

Answer as JSON: {"reply":"...","levelChange":null,"decision":null}`;
 }
};

/* ===== ORCHESTRATOR =====
   Steps are idempotent: after an error a retry skips work that is already done. */
const queue = []; let busy = false, lastFailed = null;
function run(fn){ queue.push(fn); if(!busy) drain(); }
async function drain(){
 busy = true; ui.actions();
 while(queue.length){
  const fn = queue.shift();
  try{ await fn(); lastFailed = null; }
  catch(e){ console.error(e); lastFailed = fn; queue.length = 0; addMsg({kind:'sys', level:'error', text:'⚠ ' + e.message}); }
  stopRequested = false; ui.typing(null); save(); ui.side(); ui.actions();
 }
 busy = false; ui.actions();
}

async function agentsPhase({store, todo, task, verb, prompt, economyTask, economyPrompt, ctx = {}, post}){

async function ensureRenderings(qs){

// Facts of the real repository (test files, scripts, beginnings of the source files) for the prompts of an existing project.
let factsText = '', factsTests = [];
async function loadFacts(){
 factsText = ''; factsTests = [];
 if(!SERVER || session.contextMode !== 'existing') return;
 try{ const r = await fetch('/api/facts', {cache:'no-store'}); if(r.ok){ const j = await r.json(); factsText = String(j.text || ''); factsTests = arr(j.tests).map(String); } }catch(e){}
}
const factsBlock = () => factsText ? '\n' + factsText + '\n' : '';
// A case should check a behavior of the PRODUCT. These patterns find cases about the tests themselves ("the suite runs",
// "coverage meets the threshold"). It is only a hint: small models write such cases more often, and the call is the PO's.
const WEAK_PATTERNS = [/\b(test|tests|suite|suites|module|runner|coverage)\b[^.]{0,40}\b(run|runs|running|execute|executes|executed|pass|passes|successfully|threshold|meet|meets)\b/i, /\b(existing|whole|full|entire)\s+(test\s+)?(suite|suites|tests)\b/i];
const isWeakCase = c => WEAK_PATTERNS.some(re => re.test(String(c.title || '') + ' ' + String(c.then || '')));
const TP_LEVELS = ['unit', 'integration', 'api', 'e2e', 'manual'], TP_TYPES = ['positive', 'negative', 'boundary'];
const planStories = () => session.plan.epics.flatMap(e => arr(e.stories));
// raw cases from the model -> clean cases (unknown stories dropped, values normalised)
function cleanCases(raw){
 const ids = new Set(planStories().map(x => x.id));
 return arr(raw).filter(c => c && ids.has(String(c.story))).map(c => {
  const level = TP_LEVELS.includes(c.level) ? c.level : 'unit';
  const st = planStories().find(x => x.id === String(c.story)), n = arr(st.acceptance).length;
  const crit = Number.isInteger(+c.criterion) && +c.criterion >= 0 && +c.criterion < n ? +c.criterion : 0;
  return {story:String(c.story), criterion:crit, level, type:TP_TYPES.includes(c.type) ? c.type : 'positive', title:String(c.title || '').replace(/^ *TC-[A-Za-z0-9-]+[^A-Za-z0-9]*/i, ''), given:String(c.given || ''), when:String(c.when || ''), then:String(c.then || ''), manualReason:level === 'manual' ? String(c.manualReason || '') : ''};
 }).filter(c => c.title && c.then);
}
const uncoveredCriteria = cases => planStories().flatMap(st => arr(st.acceptance).map((a, i) => ({story:st.id, criterion:i}))).filter(x => !cases.some(c => c.story === x.story && c.criterion === x.criterion));
// IDs are assigned by the app, never by the model: TC-S1-1, TC-S1-2, ...
// A short code of the plan keeps the IDs unique in a project that has had several plans: an old test called TC-S1-1
// must never be able to vouch for a new case with the same number.
const planTag = () => (session.plan && session.plan.testPlan && session.plan.testPlan.tag) || (String(session.id || '').replace(/[^A-Za-z0-9]/g, '').slice(-3).toUpperCase() || 'X');
function numberCases(cases, tag = planTag()){
 const count = {};
 return cases.map(c => { const k = c.story.replace(/[^A-Za-z0-9]/g, ''); count[c.story] = (count[c.story] || 0) + 1; return Object.assign({id:'TC-' + tag + '-' + k + '-' + count[c.story]}, c); });
}

   QA proposes, the Product Owner decides: every case can be edited, made manual, removed or replaced by a new proposal of

/* ===== INSTRUCTIONS OF THE TEAM =====

/* ===== PLAN CHECK =====
   One request after the plan and the test plan exist: orphan Definition-of-Done items, contradictions, criteria that
   cannot be verified. The Product Owner resolves each issue with one click; every resolution is written to the log. */
const PC_KINDS = ['orphan', 'contradiction', 'unmeasurable'], PC_ACTIONS = ['add_story', 'reword', 'drop', 'manual'];
const pcSource = (p, ref) => {
 if(!ref) return null;
 const list = ref.type === 'dod' ? arr(p.definitionOfDone) : ref.type === 'gate' ? arr((p.testPlan || {}).gates) : ref.type === 'risk' ? arr(p.risks) : null;
 if(list){ const x = list[ref.index]; return x === undefined ? null : String(x.text || x); }
 if(ref.type === 'criterion'){ const st = planStories().find(y => y.id === ref.story); const c = st && arr(st.acceptance)[ref.index]; return c === undefined ? null : String(c); }
 return null;
};
function normalizeCheck(res){
 const p = session.plan;
 return arr(res.issues).slice(0, 6).map((x, i) => {
  if(!x || !x.text) return null;
  const rr = x.ref && typeof x.ref === 'object' ? x.ref : null;
  const ref = rr && ['dod', 'gate', 'risk', 'criterion'].includes(rr.type) && Number.isInteger(+rr.index) ? {type:rr.type, index:+rr.index, story:rr.story ? String(rr.story) : ''} : null;
  const refText = pcSource(p, ref);
  const okRef = !!(ref && refText !== null);
  let opts = arr(x.options).filter(o => o && PC_ACTIONS.includes(o.action)).map(o => {
   const out = {action:o.action, label:String(o.label || ''), recommended:!!o.recommended};
   if(o.action === 'reword') out.rewrite = String(o.rewrite || '').trim();
   if(o.action === 'add_story') out.story = o.story && typeof o.story === 'object' ? {title:String(o.story.title || ''), description:String(o.story.description || ''), owner:String(o.story.owner || ''), estimate:+o.story.estimate || 2, acceptance:arr(o.story.acceptance).map(String).filter(Boolean)} : null;
   return out;
  }).filter(o => o.action === 'add_story' ? (o.story && o.story.title && o.story.acceptance.length)
   : o.action === 'reword' ? (okRef && o.rewrite)
   : o.action === 'drop' ? (okRef && ref.type !== 'criterion')
   : true);
  if(!opts.some(o => o.action === 'manual')) opts.push({action:'manual', label:'', recommended:false});
  if(opts.filter(o => o.recommended).length !== 1){ opts.forEach(o => o.recommended = false); opts[0].recommended = true; }
  opts.forEach(o => { if(!o.label) o.label = t('pc.opt.' + o.action); });
  return {id:'PC-' + (i + 1), kind:PC_KINDS.includes(x.kind) ? x.kind : 'unmeasurable', text:String(x.text), ref:okRef ? ref : null, refText:okRef ? refText : '', options:opts, status:'open', resolution:''};
 }).filter(Boolean);
}
/* ===== CHECKS WITHOUT A MODEL =====
   A small model misses these (the user's run: an instruction of DevOps nobody delivered, a plan that named a test file which
   already exists, a story for code owned by UX), a few lines of code do not. They add issues to the plan check; the Product
   Owner resolves them with the same buttons. */
// names an instruction is built around: text in quotes or backticks, and names of files (package.json, lib/ui.js)
function anchorsOf(text){
 const out = new Set();
 for(const m of String(text).matchAll(/[`'"]([^`'"\n]{2,60})[`'"]/g)) out.add(m[1].trim().toLowerCase());
 for(const m of String(text).matchAll(/[\w.-]+(?:\/[\w.-]+)+|[\w-]+\.[a-z]{1,5}\b/gi)) out.add(m[0].toLowerCase());
 return [...out].filter(x => x.length > 2 && !/^\d/.test(x) && !/^(node\.js|e\.g|i\.e|vs\.)$/.test(x));
}
const RB_COVER_ROLES = ['devops', 'data', 'techwriter'];
// an instruction of devops, data or techwriter that names something (a file, a field) no story of its role mentions
function rbCoverageGaps(){
 const stories = planStories(), out = [];
 const textOf = st => [st.title, st.description, ...arr(st.acceptance)].join(' ').toLowerCase();
 for(const r of RB_COVER_ROLES){
  const own = stories.filter(st => st.owner === r);
  const pool = (own.length ? own : stories).map(textOf).join('\n');
  for(const it of rbItems(r)){
   const an = anchorsOf(it.text);
   if(an.length && !an.some(a => pool.includes(a))) out.push({role:r, item:it});
  }
 }
 return out;
}
// a test file of the plan that already exists in the repository: a new case must go to a NEW file
const TF_RE = /[\w.\/-]+\.(?:test|spec)\.[a-z]+|\b(?:tests?|__tests__|spec)\/[\w.\/-]+\.[a-z]+/gi;
const normFile = f => String(f).replace(/^\.\//, '').toLowerCase();
function newTestName(file, taken){
 const m = /^(.*?)(\.(?:test|spec)\.[a-z]+|\.[a-z]+)$/i.exec(file) || [file, file, ''];
 let name = m[1] + '-' + planTag().toLowerCase() + m[2], n = 2;
 while(taken.has(normFile(name))) name = m[1] + '-' + planTag().toLowerCase() + '-' + (n++) + m[2];
 return name;
}
// every place of the plan whose text can name a file; fn(text, where) returns the same text or a changed one
function walkPlanTexts(fn){
 const p = session.plan, tp = p.testPlan || {}, st = tp.strategy || {};
 const hit = (obj, key, where) => { if(obj && typeof obj[key] === 'string'){ const v = fn(obj[key], where); if(v !== obj[key]) obj[key] = v; } };
 arr(p.definitionOfDone).forEach((x, i) => hit(p.definitionOfDone, i, 'DoD'));
 arr(p.risks).forEach((r, i) => { if(r && typeof r === 'object'){ hit(r, 'text', 'risk'); hit(r, 'mitigation', 'risk'); } else hit(p.risks, i, 'risk'); });
 arr(tp.gates).forEach((x, i) => hit(tp.gates, i, 'gate'));
 for(const k of ['runCommand', 'namingRule', 'summary']) hit(st, k, k === 'runCommand' ? 'run command' : 'strategy');
 for(const sy of planStories()){ hit(sy, 'title', sy.id); hit(sy, 'description', sy.id); arr(sy.acceptance).forEach((a, i) => hit(sy.acceptance, i, sy.id)); }
 for(const c of arr(tp.cases)) for(const k of ['title', 'given', 'when', 'then']) hit(c, k, c.id);

function existingTestFileGaps(){
 if(!factsTests.length || !session.plan) return [];
 const known = new Set(factsTests.map(normFile)), found = {};
 walkPlanTexts((text, where) => { for(const f of new Set(text.match(TF_RE) || [])) if(known.has(normFile(f))) (found[f] = found[f] || new Set()).add(where); return text; });

}
function detIssues(first){
 let n = first;
 const mk = (kind, text, ref, refText, options) => ({id:'PC-' + (n++), kind, text, ref, refText, options, status:'open', resolution:''});
 const team = arr(session.team), out = [];
 const implementer = ['fullstack', 'backend', 'frontend', 'mobile'].find(r => team.includes(r)) || team[0] || 'fullstack';
 for(const g of rbCoverageGaps().slice(0, 4)){
  const title = (t('pc.det.deliver') + ' ' + g.item.text).slice(0, 90);
  out.push(mk('orphan', t('pc.det.rbGap', {role:roleName(g.role)}), {type:'rb', index:0, story:'', role:g.role, id:g.item.id}, g.item.text, [
   {action:'add_story', label:t('pc.opt.add_story'), recommended:true, story:{title, description:g.item.text, owner:team.includes(g.role) ? g.role : implementer, estimate:2, acceptance:[g.item.text]}},
   {action:'drop', label:t('pc.opt.drop'), recommended:false},
   {action:'manual', label:t('pc.opt.manual'), recommended:false}]));
 }
 // ONE issue for all the files and ONE button that renames them everywhere: a rename done place by place leaves the old name
 // in the description of a story, in the run command or in a test case (the user's run), and the agent then gets two names.
 // a file that only the run command, a gate or a risk names is a run of OLD tests (the whole suite): no mistake, left alone.
 // A file that a story, a criterion, a case or the Definition of Done names is a file the plan means to write.
 const gaps = existingTestFileGaps().filter(g => g.where.some(w => !['run command', 'gate', 'risk'].includes(w)));
 if(gaps.length){
  const taken = new Set(factsTests.map(normFile)), renames = {};
  for(const g of gaps){ const nn = newTestName(g.file, taken); renames[g.file] = nn; taken.add(normFile(nn)); }
  out.push(mk('contradiction', t('pc.det.testFile', {files:gaps.map(g => g.file + ' (' + g.where.join(', ') + ')').join('; ')}), null, '', [
   {action:'rename', label:t('pc.opt.rename'), recommended:true, renames},
   {action:'manual', label:t('pc.opt.manual'), recommended:false}]));
 }
 return out;
}

const NON_CODING_OWNERS = ['ux', 'architect', 'ba'];
function fixStoryOwners(){
 const team = arr(session.team);
 const impl = ['fullstack', 'frontend', 'backend', 'mobile'].find(r => team.includes(r));

/* ===== AGENT SYNC =====
   The IDE agent talks to the MCP server, which keeps its reports in .ai-team/progress.json.
   The chat polls it: story statuses, the agent's questions to the PO (shown as ordinary question cards) and blockers. */
let progress = {stories:{}, questions:[], blockers:[]};
const storyStatus = id => (progress.stories[id] && progress.stories[id].status) || 'todo';
let syncing = false;
// The agent has read an answer / has not picked it up although some time has passed. Returns true if something was added.
function agentAnswersCheck(p){
 // Only fresh events are announced: an old history (answers given before this chat was opened now, or while the
 // agent kept working) is marked as handled without a message.
 const now = Date.now(), ms = x => Date.parse(x) || 0;
 const lastActivity = Math.max(0, ...Object.values(p.stories).map(x => ms(x.updatedAt)), ...p.questions.map(x => ms(x.askedAt)), ...p.questions.map(x => x.answer ? ms(x.answer.readAt) : 0));
 let changed = false;
 for(const aq of p.questions){
  const q = session.questions.find(x => x.agentQid === aq.id && x.answer);
  if(!q || !aq.answer) continue;
  const answeredAt = ms(aq.answer.ts);
  if(aq.answer.readAt){
   if(q.readSeen) continue;
   q.readSeen = true; changed = true;
   if(now - ms(aq.answer.readAt) < 120000) addMsg({kind:'sys', key:'sys.agentRead', params:{id:aq.id}});
  } else if(!q.nudged && q.reported && now - answeredAt > 20000){
   q.nudged = true; changed = true;
   // the agent is stuck only if nothing at all came from it after the answer, and the answer is not ancient
   if(lastActivity <= answeredAt && now - answeredAt < 30 * 60000) addMsg({kind:'sys', key:'sys.agentNudge', params:{id:aq.id}});
  }
 }
 return changed;
}
async function syncAgent(){
 if(!SERVER || syncing) return;
 syncing = true;
 try{
  // answers given by the PO go to the agent first
  for(const q of session.questions.filter(x => x.agentQid && x.answer && !x.reported)){
   const o = q.options.find(x => x.id === q.answer.optionId);
   const r = await fetch('/api/progress/answer', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:q.agentQid, optionId:q.answer.optionId, text:o ? o.technical : '', delegated:!!q.answer.delegated, decisionId:q.answer.decisionId})});
   if(r.ok){ q.reported = true; save(); }
  }
  const r = await fetch('/api/progress', {cache:'no-store'});
  if(!r.ok) return;
  const p = await r.json();
  if(JSON.stringify(p) === JSON.stringify(progress)){ if(agentAnswersCheck(p)){ save(); ui.side(); } return; }
  progress = p;
  const seen = session.agentSeen = session.agentSeen || {stories:{}, questions:[]};
  let touched = false;
  const plan = session.plan, all = plan ? plan.epics.flatMap(e => arr(e.stories)) : [];
  const doneCount = () => all.filter(x => (p.stories[x.id] || {}).status === 'done').length;
  for(const id of Object.keys(p.stories)){
   if(seen.stories[id] === p.stories[id].status) continue;
   seen.stories[id] = p.stories[id].status; touched = true;
   const st = all.find(x => x.id === id);
   const auto = plan && plan.testPlan ? arr(plan.testPlan.cases).filter(c => c.story === id && c.level !== 'manual') : [];
   const res = p.stories[id].testResults || {};
   const base = {id, title:st ? st.title : '', agentStatus:p.stories[id].status, done:doneCount(), total:all.length};
   const vf = p.stories[id].verification;
   if(auto.length) addMsg({kind:'sys', key:vf && p.stories[id].status === 'done' ? 'sys.agentProgressV' : 'sys.agentProgressT', params:Object.assign(base, {passed:auto.filter(c => (res[c.id] || {}).status === 'pass').length, cases:auto.length})});
   else addMsg({kind:'sys', key:'sys.agentProgress', params:base});
  }
  // the app ran the approved tests and did NOT confirm a story: tell the Product Owner what is wrong
  seen.assumptions = seen.assumptions || [];
  for(const a of arr(p.assumptions)){
   if(seen.assumptions.includes(a.id)) continue;
   seen.assumptions.push(a.id); touched = true;
   if(a.status === 'open') addMsg({kind:'sys', key:'sys.agentAssumption', params:{id:a.id, text:a.text}});
  }
  seen.verif = seen.verif || {};
  for(const id of Object.keys(p.stories)){
   const vf = p.stories[id].verification;
   if(!vf || seen.verif[id] === vf.ts) continue;
   seen.verif[id] = vf.ts; touched = true;

   if(p.stories[id].status !== 'done' && (notOk.length || vf.exitCode !== 0)) addMsg({kind:'sys', key:'sys.agentVerifyFail', params:{id, what:notOk.length ? notOk.join(', ') : t('tp.exit', {code:vf.exitCode === null ? '?' : vf.exitCode})}});
  }

  if(all.length && doneCount() === all.length){
   if(!seen.allDone){
    seen.allDone = true; touched = true;
    const manualOpen = (plan.testPlan ? arr(plan.testPlan.cases).filter(c => c.level === 'manual' && !(session.manualChecks || {})[c.id]).length : 0) + arr(plan.manualItems).filter(m => !(session.manualChecks || {})[m.id]).length + rbCheckOpen().length;
    addMsg(manualOpen ? {kind:'sys', key:'sys.agentAllDoneM', params:{total:all.length, n:manualOpen}} : {kind:'sys', key:'sys.agentAllDone', params:{total:all.length}});
    const anyVerified = all.some(x => (p.stories[x.id] || {}).verification);
    if(plan.testPlan && arr(plan.testPlan.cases).some(c => c.level !== 'manual') && !anyVerified) addMsg({kind:'sys', key:'sys.agentUnverified'});
    const openAs = arr(p.assumptions).filter(a => a.status === 'open').length;
    if(openAs) addMsg({kind:'sys', key:'sys.agentAssumptionsOpen', params:{n:openAs}});
   }
  } else if(seen.allDone){ seen.allDone = false; touched = true; }
  for(const aq of p.questions){
   if(seen.questions.includes(aq.id)) continue;
   seen.questions.push(aq.id); touched = true;
   if(aq.status !== 'open') continue;
   const q = makeQuestion({topic:(aq.topic || (aq.question.length > 70 ? aq.question.slice(0, 67) + '…' : aq.question)) + (aq.storyId ? ' (' + aq.storyId + ')' : ''), technical:aq.question, options:aq.options.map(o => ({technical:o.label, recommended:o.recommended})), recommendationReason:aq.recommendation}, 'agent');
   q.agentQid = aq.id; session.questions.push(q);

   addMsg({kind:'question', author:'sm', qid:q.id});
   run(() => ensureRenderings([q]));
  }
  if(agentAnswersCheck(p)) touched = true;
  if(touched) save();
  ui.side();
 }catch(e){ /* server unreachable: try again on the next tick */ }
 finally{ syncing = false; }
}

async function loadContext(){

// The hand-off package is written in the team's language (dictionary language, English if unknown).
function handoffMD(){
 const H = docLang(), h = (k, p) => tl(H, k, p), p = session.plan || {}, L = [];
 L.push(`# ${h('h.title', {title:session.title || h('h.project')})}`, '', h('h.generated', {v:APP_VERSION, date:new Date().toLocaleString(H)}), '');
 L.push(`## ${h('h.task')}`, '', session.request, '');
 L.push(`## ${h('h.team')}`, '', ...session.team.map(r => `- ${roleName(r, H)} (\`${r}\`)`), '');
 L.push(`## ${h('h.decisions')}`, '', ...(session.decisions.length ? session.decisions.map(d => `- **${d.id}** ${d.text}${d.rationale ? ' — ' + d.rationale : ''} _(${decSource(d, H)})_`) : [h('h.noDecisions')]), '');
 if(session.plan){
  L.push(`## ${h('h.plan')}`, '');
  if(p.sprintGoal) L.push(`**${h('h.goal')}:** ${p.sprintGoal}`, '');
  const tc = p.tech;
  if(tc && (tc.stack.length || tc.architecture || tc.components.length || tc.dataModel || tc.interfaces || tc.conventions.length || tc.outOfScope.length)){
   L.push(`### ${h('h.tech')}`, '');
   if(tc.stack.length) L.push(`**${h('h.stack')}:**`, ...tc.stack.map(x => `- ${x}`), '');
   if(tc.architecture) L.push(`**${h('h.architecture')}:**`, '', tc.architecture, '');
   if(tc.components.length) L.push(`**${h('h.components')}:**`, ...tc.components.map(c => `- \`${c.name}\`${c.responsibility ? ' — ' + c.responsibility : ''}`), '');
   if(tc.dataModel) L.push(`**${h('h.dataModel')}:**`, '', tc.dataModel, '');
   if(tc.interfaces) L.push(`**${h('h.interfaces')}:**`, '', tc.interfaces, '');
   if(tc.conventions.length) L.push(`**${h('h.conventions')}:**`, ...tc.conventions.map(x => `- ${x}`), '');
   if(tc.outOfScope.length) L.push(`**${h('h.outOfScope')}:**`, ...tc.outOfScope.map(x => `- ${x}`), '');
  }
  const tpl = p.testPlan;
  if(tpl){
   const g = tpl.strategy || {};
   L.push(`### ${h('h.testStrategy')}`, '');
   if(g.summary) L.push(g.summary, '');
   if(g.framework) L.push(`- ${h('h.framework')}: ${g.framework}`);
   if(g.runCommand) L.push(`- ${h('h.runCommand')}: \`${g.runCommand}\``);
   if(g.namingRule) L.push(`- ${h('h.naming')}: ${g.namingRule}`);
   arr(g.levels).forEach(l => L.push(`- ${l.level}: ${l.why}`));
   arr(tpl.gates).forEach(x => L.push(`- ${h('h.gate')}: ${x}`));
   L.push('');
  }
  const all = {}; p.epics.forEach(e => e.stories.forEach(s => all[s.id] = s));
  for(const sp of p.sprints) L.push(`### ${sp.name}${sp.goal ? ' — ' + sp.goal : ''}`, '', ...arr(sp.stories).map(id => `- ${id} ${all[id] ? all[id].title : ''}`), '');
  for(const e of p.epics){
   L.push(`### ${h('h.epic')}: ${e.title}`, '');
   for(const s of e.stories){
    L.push(`#### ${s.id}. ${s.title}`, '', `${h('h.owner')}: ${roleName(s.owner, H)} · ${h('h.estimate')}: ${s.estimate ?? '?'} SP · ${h('h.status')}: ${storyStatus(s.id)}${arr(s.dependsOn).length ? ' · ' + h('h.dependsOn') + ': ' + s.dependsOn.join(', ') : ''}`, '');
    if(s.description) L.push(s.description, '');
    if(arr(s.acceptance).length) L.push(h('h.ac'), ...s.acceptance.map(a => `- [ ] ${a}`), '');
    const sc = tpl ? arr(tpl.cases).filter(c => c.story === s.id) : [];
    if(sc.length) L.push(h('h.testCases'), ...sc.map(c => `- **${c.id}** [${c.level}, ${c.type}] ${c.title} — ${h('tp.given')} ${c.given}; ${h('tp.when')} ${c.when}; ${h('tp.then')} ${c.then}${c.manualReason ? ' (' + c.manualReason + ')' : ''}`), '');
   }
  }
  if(p.risks.length) L.push(`## ${h('h.risks')}`, '', ...p.risks.map(r => `- ${r.text || r}${r.mitigation ? ' — ' + h('h.mitigation') + ': ' + r.mitigation : ''}`), '');
  if(p.definitionOfDone.length) L.push(`## ${h('h.dod')}`, '', ...p.definitionOfDone.map(d => `- ${d}`), '');
  const rbs = Object.keys(session.roleBriefs || {}).filter(r => rbItems(r).length);
  if(rbs.length) L.push(`## ${h('h.roleBriefs')}`, '', ...rbs.flatMap(r => [`### ${roleName(r, H)}`, ...rbItems(r).map(x => `- ${x.text}${x.check ? ' _(' + h('rb.accept') + ')_' : ''}`), '']));
  if(arr(p.manualItems).length) L.push(`## ${h('h.manualItems')}`, '', ...p.manualItems.map(m => `- [ ] ${m.text}`), '');
 }
 L.push(`## ${h('h.ai')}`, '', h('h.ai1'), h('h.ai2'), h('h.ai3'), h('h.ai4'), h('h.ai5'), '');
 return L.join('\n');
}

 storyTests(id){
  const tp = tcPlan();

  const prog = progress.stories[id] || {}, res = prog.testResults || {}, vf = prog.verification;
  const auto = cases.filter(c => c.level !== 'manual'), manual = cases.length - auto.length;
  const story = planStories().find(x => x.id === id) || {acceptance:[]};
  const evidence = vf ? `<span class="tag">${esc(t('tp.ev.verified', {n:Object.values(vf.cases).filter(x => x === 'pass').length, m:auto.length}))}</span>` : (storyStatus(id) === 'done' ? `<span class="tag">${esc(t('tp.ev.agent'))}</span>` : '');
  const text = (f, label) => `<label class="muted">${esc(label)}</label><input type="text" data-tcf="${f}" value="${esc(tcDraft[f])}" style="width:100%">`;

  const form = () => {
   const level = `<select data-tcf="level">${TP_LEVELS.map(l => `<option value="${l}" ${tcDraft.level === l ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
   const crit = tcEdit.id ? '' : `<select data-tcf="criterion">${arr(story.acceptance).map((a, i) => `<option value="${i}" ${+tcDraft.criterion === i ? 'selected' : ''}>[${i}] ${esc(String(a).slice(0, 60))}</option>`).join('')}</select>`;
   return `<div class="item small">${text('title', t('tc.title'))}${area('given', t('tp.given'))}${area('when', t('tp.when'))}${area('then', t('tp.then'))}<div class="stack" style="margin-top:6px">${level}${crit}</div><div class="stack" style="margin-top:6px"><button class="btn primary" data-act="tc-save">${esc(t('tc.save'))}</button><button class="btn" data-act="tc-cancel">${esc(t('tc.cancel'))}</button></div></div>`;
  };
  const row = c => {
   if(tcEdit && tcEdit.id === c.id && tcDraft) return `<li>${form()}</li>`;
   const isManual = c.level === 'manual';
   const mark = isManual ? `<label><input type="checkbox" data-act="manual-toggle" data-tc="${esc(c.id)}" ${(session.manualChecks || {})[c.id] ? 'checked' : ''}> ${esc(t('tp.manual'))}</label>` : `<span class="tag">${esc(t('tp.res.' + ((res[c.id] || {}).status || 'none')))}</span>`;
   const btn = (a, label) => `<button class="btn" style="padding:1px 6px;font-size:11px" data-act="${a}" data-id="${esc(c.id)}">${esc(label)}</button>`;
   // how the case was proven: what the agent reported, and which tests of the report the app itself saw pass
   const rr = res[c.id], proof = vf && vf.tests && vf.tests[c.id];
   const lines = [];
   if(rr) lines.push(`${esc(t('tc.agent'))}: ${esc(t('tp.res.' + rr.status))}${rr.file ? ' @ ' + esc(rr.file) : ''}`);
   if(proof) lines.push(`${esc(t('tc.app'))}: ` + proof.map(x => `${esc(x.outcome)} · “${esc(x.name)}” (${esc(x.file)}${x.ms ? ', ' + x.ms + ' ms' : ''})`).join('; '));

   return `<li><b>${esc(c.id)}</b> ${isWeakCase(c) ? `<span title="${esc(t('tp.weak'))}" style="cursor:help">⚠</span> ` : ''}<span class="muted">[${esc(c.level)}, ${esc(c.type)}]</span> ${esc(c.title)} ${mark}<div class="muted">${esc(t('tp.given'))} ${esc(c.given)}; ${esc(t('tp.when'))} ${esc(c.when)}; ${esc(t('tp.then'))} ${esc(c.then)}${c.manualReason ? ' (' + esc(c.manualReason) + ')' : ''}</div>${lines.map(l => `<div class="muted">${l}</div>`).join('')}${code}<div class="stack" style="margin-top:3px">${btn('tc-edit', t('tc.edit'))}${isManual ? '' : btn('tc-manual', t('tc.manualBtn'))}${btn('tc-replace', t('tc.replace'))}${btn('tc-remove', t('tc.remove'))}${isManual ? '' : btn('tc-code', codeOpen[c.id] ? t('tc.hideCode') : t('tc.showCode'))}</div></li>`;
